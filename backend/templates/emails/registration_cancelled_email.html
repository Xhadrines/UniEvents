<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Înscriere anulată - UniEvents</title>
</head>
<body style="margin:0; padding:0; background-color:#16171d; font-family:'Segoe UI', sans-serif; color:#f3f4f6;">
  <div style="max-width:600px; margin:40px auto; padding:24px; background-color:#1e1e1e; border-radius:14px;">
    <h1 style="color:#c084fc; text-align:center;">UniEvents ❌</h1>

    <p>Salut {{ username }},</p>

    <p>
      Înscrierea ta la evenimentul
      <strong>{{ event.name }}</strong>
      a fost anulată cu succes.
    </p>

    <p>
      Sperăm să te vedem la alte evenimente organizate prin UniEvents.
    </p>

    <p style="margin-top:24px;">
      Mulțumim!
    </p>
  </div>
</body>
</html>
